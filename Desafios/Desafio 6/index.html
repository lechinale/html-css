<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Tags em HTML</title>
</head>
<body>
    <h1>Tags em HTML</h1>
    <p>Em HTML5, podemos inserir os elementos da lista a seguir. PAsse o mouse sobre os termos para descobrir qual tag deverá utulizar em cada caso</p>
    <ul type="square">
        <li><abbr title="Use a tag <p>">Paragráfos</abbr></li>
        <li><abbr title="Use as tags <h1> a <h6>">Titulos</abbr></li>
        <li><abbr title="Use a tag <img>">Imagens</abbr></li>
        <li><abbr title="Use a tag <abbr>">Abreviações</abbr></li>
        <li><abbr title="Use a tag <code>">Código-Fonte</abbr></li>
        <li><abbr title="Use as tags <ol> e <li>">Listas númeradas</abbr></li>
        <li><abbr title="Use as tagas <ul> e <li>">Listas com demarcadores</abbr></li>
    </ul>
</body>
</html>
