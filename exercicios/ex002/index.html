<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=,, initial-scale=1.0">
    <title>Paragrafos e quebras de linha</title>
</head>
<body>
    <p>Você pode
        escrever um páragrago
        de qualquer jeito.
        Basta colocar tudo
        nom meio do par de tagas &lt; p&gt; e &lt;/p&gt;
    </p>
    <p>
        Se precisar quebrar 
        o texto em algum lugar 
        específico <br> como esse, 
        você pode usar a tag &lt;br&gt;
    </p>

    <p>Vamos adicionar alguns simbolos especiais:
        &reg;
        &copy;
        &trade;
        &euro;
        &pound;
        &yen;
        &cent;
        &Delta;
        &uarr;
        
    </p>
</body>
</html>
