<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Imagens dinâmicas</title>
</head>
<body>
    <h1>Vamos trabalhar com imagens dinamicas</h1>
    <picture>
        <source media="(max-width:750px)" srcset="imagens/ex-300.png" type="image/png">
        <source media="(max-width:1050px )" srcset="imagens/ex-700.png" type="image/png">
        <img src="imagens/ex-1000.png" alt="imagem grande">
    </picture>

    <h1>Reproduzindo arquivos de audio</h1>
    
    <audio preload="auto" autoplay controls>
        <source src="midia/good.mp3" type="audio/mpeg">
    </audio>
</body>
</html>
